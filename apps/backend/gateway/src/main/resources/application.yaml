spring:
  application:
    name: gateway

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  security:
    oauth2:
      resourceserver:
        jwt:
          # Use jwk-set-uri for lazy JWKS loading (no network call on startup)
          jwk-set-uri: ${KEYCLOAK_JWK_URI:http://localhost:8080/realms/nestegg/protocol/openid-connect/certs}

  cloud:
    gateway:
      server:
        webflux:
          # Route definitions - add new services here without changing gateway code
          routes:
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/nestegg/api/v1/users/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 100
                    redis-rate-limiter.burstCapacity: 200
                    key-resolver: "#{@authenticatedUserKeyResolver}"
                - name: CircuitBreaker
                  args:
                    name: user-service
                    fallbackUri: forward:/fallback/service-unavailable

            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/nestegg/api/v1/orders/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 50
                    redis-rate-limiter.burstCapacity: 100
                    key-resolver: "#{@authenticatedUserKeyResolver}"
                - name: CircuitBreaker
                  args:
                    name: order-service
                    fallbackUri: forward:/fallback/service-unavailable

            - id: portfolio-service
              uri: lb://portfolio-service
              predicates:
                - Path=/nestegg/api/v1/portfolios/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 100
                    redis-rate-limiter.burstCapacity: 200
                    key-resolver: "#{@authenticatedUserKeyResolver}"
                - name: CircuitBreaker
                  args:
                    name: portfolio-service
                    fallbackUri: forward:/fallback/service-unavailable

            - id: market-service
              uri: lb://market-service
              predicates:
                - Path=/nestegg/api/v1/market/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 200
                    redis-rate-limiter.burstCapacity: 400
                    key-resolver: "#{@authenticatedUserKeyResolver}"

          # Default filters applied to every route
          default-filters:
            - RemoveRequestHeader=Cookie
            - name: Retry
              args:
                retries: 2
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE
                methods: GET,HEAD
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms
                  factor: 2
                  basedOnPreviousValue: false

          # HTTP client settings
          httpclient:
            connect-timeout: 2000
            response-timeout: 10s
            pool:
              max-connections: 500
              acquire-timeout: 3000

server:
  port: 1080

management:
  endpoints:
    web:
      exposure:
        include: "health,info,prometheus,metrics,gateway"
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: "${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces"

# Custom gateway configuration - controls security and rate-limiting policies
gateway:
  security:
    enabled: true
    routes:
      - path: /nestegg/api/v1/admin/**
        roles:
          - ADMIN
      - path: /nestegg/api/v1/users/**
        authenticated: true
      - path: /nestegg/api/v1/orders/**
        authenticated: true
      - path: /nestegg/api/v1/portfolios/**
        authenticated: true
      - path: /nestegg/api/v1/market/**
        authenticated: true
      - path: /fallback/**
        permit-all: true
      - path: /actuator/health
        permit-all: true

  rate-limit:
    enabled: true
    default-replenish-rate: 100
    default-burst-capacity: 200
    key-strategy: AUTHENTICATED_USER

# Resilience4j circuit-breaker defaults
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
  timelimiter:
    configs:
      default:
        timeout-duration: 10s
        cancel-running-future: true
