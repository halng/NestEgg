spring:
  application:
    name: gateway
  profiles:
    default: dev
  lifecycle:
    timeout-per-shutdown-phase: 30s
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 2000
            response-timeout: 10s

gateway:
  routes:
    - id: user-service
      path: /api/v1/users/**
      service: user-service
      methods: [GET, POST, PUT, DELETE]
      public-route: false
    - id: order-service
      path: /api/v1/orders/**
      service: order-service
      methods: [GET, POST]
      scopes: [orders.read]
      public-route: false
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    default-policy:
      requests: 1000
      burst-capacity: 1200
    routes:
      - route-id: order-service
        requests: 200
        burst-capacity: 250
    key-strategy:
      type: authenticated-user
  security:
    enabled: ${GATEWAY_SECURITY_ENABLED:true}
    issuer-uri: ${KEYCLOAK_ISSUER_URI}
    audience: ${KEYCLOAK_AUDIENCE:nestegg-api}
  timeouts:
    connect: 2s
    request: 10s

management:
  endpoints:
    web:
      exposure:
        include: "health,info,prometheus,gateway"
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0 # 1.0 means 100% of requests are traced. Lower this in production!
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT}

server:
  port: 1080
  shutdown: graceful
