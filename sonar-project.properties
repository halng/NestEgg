sonar.projectKey=halng_NestEgg
sonar.organization=halng

sonar.projectName=NestEgg
sonar.projectVersion=1.0

# Source directories
sonar.sources=apps,libs

# Test inclusions (rely on patterns rather than separate test directories to avoid source/test overlap)
sonar.test.inclusions=**/test/**,**/tests/**,**/*.spec.*,**/*.test.*,**/*Tests.java,**/*Test.java

# Exclusions
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/.nx/**,\
  **/coverage/**,\
  **/__pycache__/**,\
  **/*.pyc,\
  **/infra/**,\
  **/docs/**,\
  **/scripts/**

# Language-specific settings
sonar.java.source=21
sonar.java.target=21

# Coverage reports (populated by nx affected --target=test --coverage)
sonar.javascript.lcov.reportPaths=coverage/**/lcov.info
sonar.python.coverage.reportPaths=coverage/**/coverage.xml
sonar.java.coveragePlugin=jacoco
sonar.coverage.jacoco.xmlReportPaths=**/build/reports/jacoco/**/*.xml

# Encoding
sonar.sourceEncoding=UTF-8
