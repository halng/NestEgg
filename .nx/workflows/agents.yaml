distribute-on:
  default-linux-medium-js: 3

init-steps:
  - name: Checkout
    uses: "nrwl/nx-cloud-workflows/v4/workflow-steps/checkout/main.yaml"

  - name: Set up Node.js 20
    uses: "nrwl/nx-cloud-workflows/v4/workflow-steps/install-node/main.yaml"
    env:
      NODE_VERSION: "20"

  - name: Set up JDK 21
    uses: "nrwl/nx-cloud-workflows/v4/workflow-steps/install-java/main.yaml"
    env:
      JAVA_VERSION: "21"
      JAVA_DISTRIBUTION: "temurin"

  - name: Set up Python 3.11
    uses: "nrwl/nx-cloud-workflows/v4/workflow-steps/install-python/main.yaml"
    env:
      PYTHON_VERSION: "3.11"

  - name: Install Nx
    run: ./nx --version
