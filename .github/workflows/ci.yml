name: "CI"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 2 * * 1" # Weekly on Monday at 02:00 UTC

permissions:
  contents: read
  security-events: write
  pull-requests: read

jobs:
  # ── NX Cloud CI Setup ──────────────────────────────────────────────────────
  setup:
    name: NX Cloud CI Setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.15"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install NX
        run: npm add -g nx@latest
      - name: Install NX Plugins
        run: pwd && npx nx add @nx/gradle@latest
      - name: NX Cloud — start CI run
        run: npx nx-cloud start-ci-run --distribute-on="3 linux-medium-js"
      - name: Build affected projects
        run: npx nx affected --target=build --parallel=3

