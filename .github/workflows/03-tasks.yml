name: "03 - Tasks"

on:
  pull_request:
    types: [labeled]

permissions:
  issues: write
  contents: write
  pull-requests: write

jobs:
  generate-tasks:
    name: Generate Task Plan
    runs-on: ubuntu-latest
    if: github.event.label.name == 'design-approved'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure task labels exist
        uses: actions/github-script@v7
        with:
          script: |
            const labels = [
              { name: 'task-pending', color: 'fbca04', description: 'Task plan is pending human review' },
              { name: 'task-approved', color: '0e8a16', description: 'Task plan has been approved by human reviewer' },
            ];
            for (const label of labels) {
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ...label,
                });
              } catch (e) {
                if (e.status !== 422) throw e;
              }
            }

      - name: Invoke Task Planner Agent to generate task list with Codex CLI
        uses: ./.github/actions/run-codex
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          role: egg-task-planner
          skills: architecture testing security observability
          prompt: |
            The design on PR #${{ github.event.pull_request.number }} is approved. Read docs/specs/ and docs/design/, then create docs/tasks/tasks-${{ github.event.pull_request.number }}.md with an atomic task list, dependency graph, test plan, risks, parallel work, enablers, rollout tasks, and complexity estimates.

      - name: Commit and push Codex artifacts
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet && { echo "Codex produced no artifact changes"; exit 1; }
          git commit -m "docs: generate task plan with Codex"
          git push

      - name: Apply task-pending label
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              labels: ['task-pending'],
            });

      - name: Remove design-approved label
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                name: 'design-approved',
              });
            } catch (e) {
              if (e.status !== 404) throw e;
            }

  validate-tasks:
    name: Validate Task Plan
    runs-on: ubuntu-latest
    if: github.event.label.name == 'task-pending'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check task plan exists and is complete
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const tasksDir = 'docs/tasks';

            if (!fs.existsSync(tasksDir)) {
              core.setFailed(`Tasks directory '${tasksDir}' not found. The Task Planner Agent must create it.`);
              return;
            }

            const files = fs.readdirSync(tasksDir).filter(f => f.endsWith('.md'));
            if (files.length === 0) {
              core.setFailed('No task plan found in docs/tasks/. The Task Planner Agent must create one.');
              return;
            }

            const requiredSections = [
              'Task List', 'Dependency', 'Test Plan', 'Risk'
            ];

            for (const file of files) {
              const content = fs.readFileSync(path.join(tasksDir, file), 'utf8');
              const missing = requiredSections.filter(s => !content.includes(s));
              if (missing.length > 0) {
                core.setFailed(`Task plan '${file}' is missing sections: ${missing.join(', ')}`);
                return;
              }
            }

            core.info('Task plan validation passed.');
