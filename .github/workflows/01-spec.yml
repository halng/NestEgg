name: "01 - Spec"

on:
  issues:
    types: [opened, reopened]
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "docs/specs/**"

permissions:
  issues: write
  contents: write
  pull-requests: write

jobs:
  generate-spec:
    name: Generate Feature Spec
    runs-on: ubuntu-latest
    if: github.event_name == 'issues'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure spec-pending label exists
        uses: actions/github-script@v7
        with:
          script: |
            const labels = [
              { name: 'spec-pending', color: 'fbca04', description: 'Feature spec is pending human review' },
              { name: 'spec-approved', color: '0e8a16', description: 'Feature spec has been approved by human reviewer' },
            ];
            for (const label of labels) {
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ...label,
                });
              } catch (e) {
                if (e.status !== 422) throw e; // 422 = already exists
              }
            }

      - name: Label issue as spec-pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['spec-pending'],
            });

      - name: Invoke Planner Agent to write feature spec with Codex CLI
        uses: ./.github/actions/run-codex
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          role: egg-business-analyst
          skills: architecture security
          prompt: |
            Generate a feature specification for issue #${{ github.event.issue.number }} from its title and body below. Create docs/specs/feature-${{ github.event.issue.number }}.md with Summary, User Stories, Acceptance Criteria, Scope, Dependencies, Risks, and Open Questions. Ensure every criterion is measurable.

            Issue title: ${{ github.event.issue.title }}
            Issue body: ${{ github.event.issue.body }}

      - name: Publish specification pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          branch="codex/spec-${{ github.event.issue.number }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add docs/specs/
          git commit -m "docs: add specification for issue #${{ github.event.issue.number }}"
          git push --set-upstream origin "$branch"
          gh pr create --base "${{ github.event.repository.default_branch }}" --head "$branch" \
            --title "Spec: ${{ github.event.issue.title }}" \
            --body "Closes #${{ github.event.issue.number }}"

  validate-spec:
    name: Validate Feature Spec (on PR)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check spec file exists and is complete
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const specDir = 'docs/specs';
            if (!fs.existsSync(specDir)) {
              core.setFailed(`Spec directory '${specDir}' not found. Please create the spec file.`);
              return;
            }
            const files = fs.readdirSync(specDir).filter(f => f.endsWith('.md'));
            if (files.length === 0) {
              core.setFailed('No spec file found in docs/specs/. The Planner Agent must create one.');
              return;
            }
            const requiredSections = [
              'Summary', 'User Stories', 'Acceptance Criteria', 'Scope', 'Dependencies'
            ];
            for (const file of files) {
              const content = fs.readFileSync(path.join(specDir, file), 'utf8');
              const missing = requiredSections.filter(s => !content.includes(s));
              if (missing.length > 0) {
                core.setFailed(`Spec file '${file}' is missing sections: ${missing.join(', ')}`);
              }
            }
            core.info('Spec validation passed.');
