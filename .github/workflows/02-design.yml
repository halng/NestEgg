name: "02 - Design"

on:
  pull_request:
    types: [labeled]

permissions:
  issues: write
  contents: write
  pull-requests: write

jobs:
  generate-design:
    name: Generate Architecture Design
    runs-on: ubuntu-latest
    if: github.event.label.name == 'spec-approved'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure design labels exist
        uses: actions/github-script@v7
        with:
          script: |
            const labels = [
              { name: 'design-pending', color: 'fbca04', description: 'Architecture design is pending human review' },
              { name: 'design-approved', color: '0e8a16', description: 'Architecture design has been approved by human reviewer' },
            ];
            for (const label of labels) {
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ...label,
                });
              } catch (e) {
                if (e.status !== 422) throw e;
              }
            }

      - name: Invoke Architect Agent to produce design artifacts with Codex CLI
        uses: ./.github/actions/run-codex
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          role: egg-techinical-architect
          skills: architecture database grpc-protobuf kafka-events observability security
          prompt: |
            The feature specification on PR #${{ github.event.pull_request.number }} is approved. Read docs/specs/ and create docs/design/design-${{ github.event.pull_request.number }}.md covering architecture overview, communication patterns, API contracts, data design, security, observability, trade-offs, risks, and rollout. Create a matching ADR in docs/adr/ for every significant decision.

      - name: Commit and push Codex artifacts
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet && { echo "Codex produced no artifact changes"; exit 1; }
          git commit -m "docs: generate architecture design with Codex"
          git push

      - name: Apply design-pending label
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              labels: ['design-pending'],
            });

      - name: Remove spec-approved label
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                name: 'spec-approved',
              });
            } catch (e) {
              if (e.status !== 404) throw e;
            }

  validate-design:
    name: Validate Architecture Design
    runs-on: ubuntu-latest
    if: github.event.label.name == 'design-pending'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check design artifacts exist
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const checks = [
              { dir: 'docs/design', label: 'Design document' },
              { dir: 'docs/adr',    label: 'ADR' },
            ];

            let failed = false;
            for (const { dir, label } of checks) {
              if (!fs.existsSync(dir)) {
                core.warning(`${label} directory '${dir}' not found.`);
                continue;
              }
              const files = fs.readdirSync(dir).filter(f => f.endsWith('.md'));
              if (files.length === 0) {
                core.warning(`No ${label} files found in ${dir}/.`);
              }
            }

            const designDir = 'docs/design';
            if (fs.existsSync(designDir)) {
              const requiredSections = [
                'Architecture Overview', 'Communication Patterns', 'Security', 'Rollout'
              ];
              for (const file of fs.readdirSync(designDir).filter(f => f.endsWith('.md'))) {
                const content = fs.readFileSync(path.join(designDir, file), 'utf8');
                const missing = requiredSections.filter(s => !content.includes(s));
                if (missing.length > 0) {
                  core.setFailed(`Design document '${file}' is missing sections: ${missing.join(', ')}`);
                  failed = true;
                }
              }
            }

            if (!failed) {
              core.info('Architecture design validation passed.');
