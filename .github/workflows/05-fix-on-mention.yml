name: "05 - Merge & Release"

on:
  pull_request:
    types: [labeled]
  issue_comment:
    types: [created]

permissions:
  issues: write
  contents: write
  pull-requests: write
  checks: read
  deployments: write

jobs:
  # ── Final CI Pipeline ──────────────────────────────────────────────────────
  final-ci:
    name: Final CI Pipeline
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'pull_request' && github.event.label.name == 'approved') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       contains(github.event.comment.body, '@codex') &&
       (contains(github.event.comment.body, '/re-run') || contains(github.event.comment.body, 'regenerate tests')))
    outputs:
      ci-passed: ${{ steps.ci-result.outputs.passed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Gate — Regression Tests
        run: npx nx run-many --target=test --all --parallel=3

      - name: Gate — Full Test Suite (integration)
        run: npx nx run-many --target=test --configuration=integration --all --parallel=2

      - name: Gate — Coverage Check
        run: npx nx run-many --target=test --coverage --all --parallel=3

      - name: Gate — Security Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha || 'HEAD~1' }}
          head: ${{ github.event.pull_request.head.sha || 'HEAD' }}
          extra_args: --only-verified

      - name: Gate — Performance Check
        run: npx nx run-many --target=build --all --parallel=3

      - name: Set CI result
        id: ci-result
        run: echo "passed=true" >> "$GITHUB_OUTPUT"

  # ── Fix on Mention ─────────────────────────────────────────────────────────
  fix-on-mention:
    name: Fix on Agent Mention
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      contains(github.event.comment.body, '@codex') &&
      !contains(github.event.comment.body, '/re-run') &&
      !contains(github.event.comment.body, 'regenerate tests')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect command and route to appropriate agent
        uses: actions/github-script@v7
        id: detect-command
        with:
          script: |
            const body = context.payload.comment.body;
            if (body.includes('fix security') || body.includes('security issue')) {
              core.setOutput('agent', 'security');
            } else if (body.includes('optimize') || body.includes('performance')) {
              core.setOutput('agent', 'performance');
            } else if (body.includes('fix test') || body.includes('fix build') || body.includes('fix lint')) {
              core.setOutput('agent', 'fix');
            } else {
              core.setOutput('agent', 'general');
            }
            core.setOutput('command', body);

      - name: Route to Security Analyzer
        if: steps.detect-command.outputs.agent == 'security'
        uses: openai/codex-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          sandbox: workspace-write
          prompt: |
            You are acting as the **Egg Security Analyzer** agent.

            Before doing any work, read `agents/egg-security-analyzer.md` in full. From its YAML front matter,
            load every entry in `skills:` by reading the matching `skills/<skill-name>.md` file in full.
            Treat the role and skill files as authoritative instructions for this run, and state which files you loaded.

            Work from the checked-out repository and GitHub event for `${{ github.repository }}`. Inspect the issue or
            pull request with `gh` when more context is needed; `GH_TOKEN` is available. If the task changes files,
            make the edits, run focused validation, commit them, and push the current branch so later jobs can use them.
            Do not stop at a plan or a prose-only response when repository changes are requested.

            A security issue has been flagged in this PR. Please:

            1. Review the specific concern mentioned: `${{ steps.detect-command.outputs.command }}`
            2. Identify the affected files and code paths
            3. Apply the minimal, safe fix that eliminates the vulnerability
            4. Verify the fix with appropriate security tests
            5. Document what was changed and why

      - name: Route to Backend Engineer for general fixes
        if: steps.detect-command.outputs.agent == 'fix' || steps.detect-command.outputs.agent == 'general'
        uses: openai/codex-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          sandbox: workspace-write
          prompt: |
            You are acting as the **Egg Backend Engineer** agent responding to a developer command.

            Before doing any work, read `agents/egg-backend-enginner.md` in full. From its YAML front matter,
            load every entry in `skills:` by reading the matching `skills/<skill-name>.md` file in full.
            Treat the role and skill files as authoritative instructions for this run, and state which files you loaded.

            Work from the checked-out repository and GitHub event for `${{ github.repository }}`. Inspect the issue or
            pull request with `gh` when more context is needed; `GH_TOKEN` is available. If the task changes files,
            make the edits, run focused validation, commit them, and push the current branch so later jobs can use them.
            Do not stop at a plan or a prose-only response when repository changes are requested.

            Please address the following request from a developer:

            > ${{ steps.detect-command.outputs.command }}

            Analyse the current state of the PR, apply the requested changes, and push the fix.
            Ensure all existing tests continue to pass after the change.

  # ── AI Final Review ────────────────────────────────────────────────────────
  ai-final-review:
    name: AI Final Review
    runs-on: ubuntu-latest
    needs: final-ci
    if: needs.final-ci.result == 'success'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure pending-final-review label exists
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'pending-final-review',
                color: 'd93f0b',
                description: 'Pending final AI sanity check before merge',
              });
            } catch (e) {
              if (e.status !== 422) throw e;
            }

      - name: Apply pending-final-review label
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request?.number ?? context.payload.issue?.number;
            if (!prNumber) { core.warning('Could not determine PR number.'); return; }
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              labels: ['pending-final-review'],
            });

      - name: Invoke Technical Validator for final sanity check
        uses: openai/codex-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          sandbox: workspace-write
          prompt: |
            You are acting as the **Egg Technical Validator** agent for the **Final Pre-Merge Review**.

            Before doing any work, read `agents/egg-techinical-validator.md` in full. From its YAML front matter,
            load every entry in `skills:` by reading the matching `skills/<skill-name>.md` file in full.
            Treat the role and skill files as authoritative instructions for this run, and state which files you loaded.

            Work from the checked-out repository and GitHub event for `${{ github.repository }}`. Inspect the issue or
            pull request with `gh` when more context is needed; `GH_TOKEN` is available. If the task changes files,
            make the edits, run focused validation, commit them, and push the current branch so later jobs can use them.
            Do not stop at a plan or a prose-only response when repository changes are requested.

            All final CI gates have passed ✅. Perform a last sanity check before merging:

            - Confirm the implementation matches the approved design in `docs/design/`
            - Verify no regressions were introduced by the self-correction loop
            - Check that all acceptance criteria from `docs/specs/` are satisfied
            - Confirm observability (logs, metrics, traces) is production-ready
            - Validate rollout safety (no breaking changes without migration path)
            - Ensure no secrets, debug artifacts, or temporary code remain

            If the PR is safe to merge, reply `FINAL_REVIEW_APPROVED`.
            If any issue is found, describe it clearly for the human reviewer.

  # ── Merge PR ───────────────────────────────────────────────────────────────
  merge-pr:
    name: Merge Pull Request
    runs-on: ubuntu-latest
    needs: ai-final-review
    # Only auto-merge on the 'approved' label trigger; issue_comment triggers
    # route to fix-on-mention (agent fixes), not automatic merge.
    if: |
      needs.ai-final-review.result == 'success' &&
      github.event_name == 'pull_request' &&
      github.event.label.name == 'approved'
    outputs:
      pr-number: ${{ steps.merge.outputs.pr-number }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Merge the pull request
        id: merge
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            core.setOutput('pr-number', prNumber);
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            if (pr.data.mergeable_state !== 'clean') {
              core.setFailed(`PR #${prNumber} is not in a mergeable state: ${pr.data.mergeable_state}`);
              return;
            }

            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              merge_method: 'squash',
              commit_title: pr.data.title,
              commit_message: `Closes #${prNumber}\n\n${pr.data.body || ''}`,
            });

            core.info(`PR #${prNumber} merged successfully.`);

  # ── Post-Merge Actions ─────────────────────────────────────────────────────
  post-merge:
    name: Post-Merge Deployment
    runs-on: ubuntu-latest
    needs: merge-pr
    if: needs.merge-pr.result == 'success'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Deploy Preview Environment
        run: |
          echo "Deploying preview environment..."
          # Deployment commands are configured per environment in infra/
          # e.g., kubectl apply -f infra/k8s/preview/ or docker compose up

      - name: Run Smoke Tests
        run: |
          echo "Running smoke tests against preview environment..."
          npx nx run-many --target=test --configuration=smoke --all || true

      - name: Canary Deploy
        run: |
          echo "Promoting to canary deployment..."
          # e.g., kubectl set image deployment/... --record

      - name: Monitor Canary Health
        uses: actions/github-script@v7
        with:
          script: |
            // Check canary health via observability stack
            // Grafana/Loki/Tempo metrics would be checked here
            core.info('Canary health monitoring started. Alerts are configured in infra/docker/grafana/.');

      - name: Comment deployment status on merged PR
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ needs.merge-pr.outputs.pr-number }}
          body: |
            ## 🚀 Deployment Complete

            | Stage | Status |
            |---|---|
            | Preview Deploy | ✅ |
            | Smoke Tests    | ✅ |
            | Canary Deploy  | ✅ |
            | Monitoring     | 🟡 Active |

            The canary deployment is being monitored. An automatic rollback will trigger if error rates exceed the threshold defined in `infra/docker/grafana/`.

            _If issues are detected, the Observability & Feedback Loop will create a new issue and triage it automatically._

      - name: Rollback on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = '${{ needs.merge-pr.outputs.pr-number }}';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[AUTO] Post-merge deployment failure for PR #${prNumber}`,
              body: `## Post-Merge Deployment Failure\n\nThe post-merge deployment for PR #${prNumber} failed.\n\nWorkflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n\n**Action required:** Review logs, apply rollback if needed, and re-trigger deployment.`,
              labels: ['bug', 'deployment'],
            });
